# NEPSE Bot default configuration
# Override via environment variables or a local config file.
# All monetary values are in NPR unless noted.

bot:
  name: nepse_bot
  mode: paper             # research | backtest | paper | live (live blocked)
  timezone: Asia/Kathmandu

market:
  exchange: NEPSE
  continuous_open: "11:00"
  continuous_close: "15:00"
  trading_weekdays: [0, 1, 2, 3, 4]
  daily_price_limit_pct: 15.0

costs:
  commission_slabs:
    - [50000, 0.36]
    - [500000, 0.33]
    - [2000000, 0.31]
    - [10000000, 0.27]
    - [null, 0.24]
  sebon_fee_pct: 0.015
  dp_charge_npr: 25.0
  cgt_short_term_pct: 10.0
  cgt_long_term_pct: 7.5
  slippage_pct: 0.10

risk:
  max_risk_per_trade_pct: 1.0
  max_daily_loss_pct: 3.0
  max_open_positions: 3
  max_position_size_pct: 20.0
  max_order_frequency_per_minute: 10
  emergency_kill_switch: false

universe:
  default_symbols:
    - NABIL
    - NICA
    - SCB
    - EBL
    - NBL
    - ADBL
    - NMB
    - SANIMA
    - KBL
    - GBIME

data:
  storage_dir: data/storage
  log_dir: logs

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  rotation: daily
  retention_days: 14

indicators:
  sma_periods: [20, 50, 200]
  ema_periods: [9, 21, 50, 200]
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  adx_period: 14
  stoch_k: 14
  stoch_d: 3
  roc_period: 12
  momentum_period: 10
  rvol_period: 20
  sr_lookback: 20
  week_52_bars: 252
  gap_min_pct: 0.5

signals:
  rsi_buy_min: 40.0
  rsi_buy_max: 70.0
  rsi_oversold: 30.0
  rsi_overbought: 70.0
  min_relative_volume: 1.2
  require_above_ema50: true
  require_above_ema200: false
  prefer_breakout: true
  adx_trend_min: 20.0
  require_positive_eps_growth: false
  require_positive_roe: false
  max_pe: null
  max_pb: null
  prefer_outperform_nepse_20d: true
  avoid_strong_downtrend_market: true
  buy_setup_min_passed: 5
  buy_setup_max_failed: 2
  watch_min_passed: 3
  sell_setup_min_failed_bullish: 4
  atr_stop_mult: 1.5
  atr_target_mult: 2.5
